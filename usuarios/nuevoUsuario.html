<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nuevo Usuario - Administrador</title>


    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/usuario.css">
</head>

<body>

    <div class="admin-container">


        <aside class="sidebar">

            <div class="logo">
                <h2>Level-UP Gamer</h2>
                <span>Administrador</span>
            </div>

            <nav class="menu">


                <a href="../admin.html" class="menu-item">
                    <i class="bi bi-house-door"></i>
                    <span>Dashboard</span>
                </a>


                <div class="menu-section">

                    <p class="section-title">
                        <i class="bi bi-box-seam"></i>
                        Productos
                    </p>

                    <a href="../productos/nuevoProducto.html">
                        <i class="bi bi-plus-circle"></i>
                        Nuevo producto
                    </a>

                    <a href="../productos/editarProducto.html">
                        <i class="bi bi-pencil-square"></i>
                        Editar producto
                    </a>

                    <a href="../productos/mostrarProducto.html">
                        <i class="bi bi-box-seam"></i>
                        Mostrar productos
                    </a>

                </div>


                <div class="menu-section">

                    <p class="section-title">
                        <i class="bi bi-people"></i>
                        Usuarios
                    </p>

                    <a href="nuevoUsuario.html" class="menu-item active">
                        <i class="bi bi-person-plus"></i>
                        Nuevo usuario
                    </a>

                    <a href="editarUsuario.html">
                        <i class="bi bi-person-gear"></i>
                        Editar usuario
                    </a>

                    <a href="mostrarUsuario.html">
                        <i class="bi bi-person-lines-fill"></i>
                        Mostrar usuarios
                    </a>

                </div>

            </nav>


            <div class="sidebar-bottom">
                <a href="../index.html">
                    <i class="bi bi-box-arrow-left"></i>
                    Cerrar sesión
                </a>
            </div>

        </aside>



        <main class="main-content">

            <header class="header">

                <div>
                    <h1>Nuevo usuario</h1>
                    <p>Registra un nuevo usuario en el sistema.</p>
                </div>

            </header>



            <section class="usuario-container">

                <div class="usuario-header">

                    <div>
                        <h2>Registrar usuario</h2>
                        <p>Completa los datos solicitados.</p>
                    </div>

                </div>


                <div class="usuario-table-container">

                    <form class="usuario-form">


                        <div class="form-group">

                            <label for="nombre">
                                Nombre completo
                            </label>

                            <input type="text" id="nombre" name="nombre" placeholder="Ingrese el nombre completo"
                                required>

                        </div>



                        <div class="form-group">

                            <label for="correo">
                                Correo electrónico
                            </label>

                            <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>

                        </div>



                        <div class="form-group">

                            <label for="contrasena">
                                Contraseña
                            </label>

                            <input type="password" id="contrasena" name="contrasena"
                                placeholder="Ingrese una contraseña" required>

                        </div>



                        <div class="form-group">

                            <label for="telefono">
                                Teléfono
                            </label>

                            <input type="tel" id="telefono" name="telefono" placeholder="+56 9 1234 5678" required>

                        </div>



                        <div class="usuario-form-buttons">

                            <a href="mostrarUsuario.html" class="btn-cancelar-usuario">
                                Cancelar
                            </a>

                            <button type="submit" class="btn-guardar-usuario">
                                <i class="bi bi-person-plus"></i>
                                Registrar usuario
                            </button>

                        </div>

                    </form>

                </div>

            </section>

        </main>

    </div>

</body>

</html>
